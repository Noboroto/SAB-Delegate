# Throwaway Postgres for the DB specs (`pnpm test-db:start`). Never a deploy
# file: it publishes a port, trusts every connection and keeps nothing.
name: sab-test-db

services:
  sab-test-postgres:
    # Same image as production, pinned by digest: a major bump upgrades the data
    # directory in place, and uuidv7() needs 18.
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: 'no'
    # UTC session time zone: a pool in another zone shifts timestamptz by hours.
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    environment:
      POSTGRES_USER: sab_test
      POSTGRES_DB: sab_test
      # Safe only because the data lives in memory and the port is loopback.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      # Loopback and a fixed port: never reachable from the network, and a busy
      # port is an error to resolve rather than a reason to pick another one.
      - '127.0.0.1:5451:5432'
    tmpfs:
      - /var/lib/postgresql
    shm_size: 256m
    mem_limit: 1g
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sab_test -d sab_test']
      interval: 2s
      timeout: 3s
      retries: 30
