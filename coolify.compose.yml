# Production stack, deployed by Coolify on every push to main.
#
# Coolify specifics:
#   * No `networks:` block. Coolify gives each resource its own network and
#     registers every compose service name as an alias there.
#   * No `container_name:`, named volumes or `${VAR:?}`: Coolify 4.3 overrides or
#     mangles all three.
#   * CPU is bounded only through deploy.resources; a service-level `cpus:` with
#     a different value makes compose reject the whole file.
#
# Builds from source. root/pnpm-lock.yaml is committed and installed with
# --frozen-lockfile, so every build installs exactly the locked versions.
#
# Data: the sqlite files are an absolute bind mount under /srv/appdata, the
# host's location for persistent data, so they survive redeploys and do not
# depend on Coolify's per-application directory.
services:
  bot:
    build:
      context: .
      dockerfile: dockerfile
    restart: always
    env_file:
      - .env
    volumes:
      - /srv/appdata/sab-delegate/files:/usr/files:rw
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      - NOTE_DB_PATH=/usr/files/note.sqlite
      - WORD_DB_PATH=/usr/files/word.sqlite
      - DICT_DB_PATH=/usr/files/dict.sqlite
      - CONFIG_DB_PATH=/usr/files/config.sqlite
      - BIRTHDAY_DB_PATH=/usr/files/birthday.sqlite
      - TOKENS=${TOKENS}
