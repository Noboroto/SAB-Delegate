# Production stack, deployed by Coolify on every push to main.
#
# Four services. Three share one image family (apps/server/Dockerfile):
#   sab-release  one-shot: dumps a non-empty database, applies migrations, then
#                exits. The server waits for it to finish successfully.
#   sab-server   the Discord bot, the REST API and the MCP endpoint.
#   sab-backup   daily dump, outside the server process.
# and the dashboard has its own image (apps/web/Dockerfile):
#   sab-web      the Next.js dashboard. The only service with a public domain
#                (attached in Coolify, container port 3101); it forwards /api/*
#                and /mcp to sab-server by service name. It never joins sab-db.
#
# Postgres is a separate Coolify resource (deploy/postgres.compose.yml). Coolify
# deletes and recreates every container of a compose app on each deploy, so the
# database must not live here. The three services reach it over the external
# network `sab-db`, created by hand once (`docker network create sab-db`), by the
# alias `sab-postgres`. Nothing else joins that network (sab-web included).
#
# Coolify specifics:
#   * No `container_name:`, named volumes or `${VAR:?}`: Coolify 4.3 overrides or
#     mangles all three. Required variables are checked by the server at boot.
#   * CPU is bounded only through deploy.resources; a service-level `cpus:` with
#     a different value makes compose reject the whole file.
#   * No `ports:`. Nothing here is published to the host.
#   * Every service lists its variables by name under `environment:`; there is no
#     env_file. Coolify turns each `${NAME}` into a variable of the resource, so a
#     service only ever sees what it is listed to receive. The legacy TOKENS
#     variable stays in the Coolify resource until the rollback window closes but
#     is deliberately listed nowhere.
#
# Data: bind mounts are absolute directories under /srv/appdata, the host's
# location for persistent data. Create /srv/appdata/sab-delegate/backups (mode
# 0700) before the first deploy. Directories, not single files: a file mount
# keeps the old inode after a git pull.
networks:
  sab-db:
    external: true
    name: sab-db

services:
  sab-release:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: release
    # Never pull: the image is built here, and a registry lookup of the
    # locally-built name only slows the deploy down.
    pull_policy: never
    # A finished one-shot must not be restarted, and Coolify then leaves it out
    # of the app's health status.
    restart: 'no'
    networks:
      - default
      - sab-db
    environment:
      POSTGRES_HOST: sab-postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB}
      # The runtime role's name: the release job grants it data access.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_MIGRATE_USER: ${POSTGRES_MIGRATE_USER}
      POSTGRES_MIGRATE_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD}
      BACKUP_DIR: /backups
      # No BACKUP_ENABLED: the release job always dumps a non-empty database.
      BACKUP_KEEP_PRE_MIGRATE: ${BACKUP_KEEP_PRE_MIGRATE:-5}
    volumes:
      - /srv/appdata/sab-delegate/backups:/backups:rw
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M

  sab-server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: runner
    pull_policy: never
    # Map form on purpose: the list form does not wait for completion.
    depends_on:
      sab-release:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - default
      - sab-db
    stop_signal: SIGTERM
    # Longer than the 30 s pg-boss drain, so a deploy finishes in-flight jobs
    # instead of killing them.
    stop_grace_period: 45s
    # Readiness: green only once Postgres answers and the bot is logged in to
    # Discord (or the deploy is deliberately in migration-pending mode).
    # start_interval probes quickly inside start_period so a healthy boot is
    # reported within seconds.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3100/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 3s
    environment:
      APP_ENV: ${APP_ENV}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_ALLOWED_APP_IDS: ${DISCORD_ALLOWED_APP_IDS}
      ADMIN_GUILD_ID: ${ADMIN_GUILD_ID}
      # Fail-safe default: an unset or empty value keeps the bot offline. Going
      # live is an explicit MIGRATION_PENDING=false (docs/cutover-runbook.md).
      MIGRATION_PENDING: ${MIGRATION_PENDING:-true}
      COMMANDS_FORCE_RESET: ${COMMANDS_FORCE_RESET:-false}
      POSTGRES_HOST: sab-postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      PGBOSS_POOL_MAX: ${PGBOSS_POOL_MAX:-4}
      PGBOSS_WORKERS_ENABLED: ${PGBOSS_WORKERS_ENABLED:-true}
      # REST API, dashboard login and MCP are on exactly when APP_URL is set; the
      # server refuses to boot with APP_URL but without the other three (and in
      # production without TRUSTED_PROXY_IPS). Unset all four = bot only.
      APP_URL: ${APP_URL}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # Every hop between the browser and the server: Traefik and sab-web.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # TEMPORARY: the legacy sqlite files, read-only, for the one-off quick.db
      # import (docker exec into this container). Remove this line, and the
      # directory on the host, once the rollback window has closed.
      - /srv/appdata/sab-delegate/files-final:/legacy:ro
    # Starting values; tune from the measured RSS.
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 768M

  sab-backup:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: release
    pull_policy: never
    depends_on:
      sab-release:
        condition: service_completed_successfully
    restart: unless-stopped
    # Only the database network: the dump job has no reason to reach anything else.
    networks:
      - sab-db
    # A sleep loop instead of crond: no dependence on how crond passes the
    # environment or reads TZ. It sleeps until the next 03:00 Asia/Ho_Chi_Minh
    # (the TZ below, read from tzdata in the image), runs the dump, and a failed
    # dump is logged and retried the next day rather than ending the container.
    # `$$` is compose's escape for a literal `$` the shell expands.
    entrypoint:
      - /bin/sh
      - -c
      - |
        rm -f /tmp/backup-started
        touch /tmp/backup-started
        while :; do
          set -- $$(date +'%H %M %S')
          elapsed=$$(( $${1#0} * 3600 + $${2#0} * 60 + $${3#0} ))
          wait=$$(( (10800 - elapsed + 86400) % 86400 ))
          echo "backup: next daily dump in $${wait}s"
          sleep "$$wait"
          /bin/sh /app/apps/server/scripts/backup.sh daily || echo "backup: daily dump failed" >&2
          sleep 60
        done
    # Healthy while a daily dump is under 26 h old (a 03:00 job plus 2 h of
    # slack). A new container has no dump yet, so for its first 26 h the start
    # marker stands in; a pre-migrate or baseline dump is NOT accepted, or it
    # could hide a failing daily job.
    healthcheck:
      test: ['CMD-SHELL', "find /backups -maxdepth 1 -name '*-daily-*.dump' -mmin -1560 | grep -q . || find /tmp/backup-started -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_HOST: sab-postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
    volumes:
      - /srv/appdata/sab-delegate/backups:/backups:rw
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  sab-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    pull_policy: never
    # service_started, not service_healthy: the web's own probe never touches the
    # server, and a bot that is slow to log in to Discord must not keep the
    # dashboard (or its failed health check) from coming up.
    depends_on:
      sab-server:
        condition: service_started
    restart: unless-stopped
    # No `networks:` key on purpose: the service then joins the compose default
    # network (where it reaches sab-server by name) and Coolify adds its proxy
    # network itself. It must never join sab-db.
    stop_signal: SIGTERM
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3101/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 3s
    # Runtime settings only, no secrets: sessions and OAuth live in sab-server.
    # SERVER_INTERNAL_URL is deliberately absent: the rewrite target is baked into
    # the image at build time (default http://sab-server:3100), so a runtime value
    # could only disagree with it.
    environment:
      NODE_ENV: production
      PORT: '3101'
      HOSTNAME: 0.0.0.0
      # Keeps the V8 heap under the container limit so a spike is a GC pause,
      # not an OOM kill.
      NODE_OPTIONS: --max-old-space-size=384
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
