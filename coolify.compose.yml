# Coolify-native variant of prod.compose.yml.
#
# prod.compose.yml is kept unchanged as the rollback artefact.
#
# What differs and why:
#   * No `networks:` block. Coolify gives each resource its own network and registers
#     every compose SERVICE name as an alias there, so intra-stack lookups keep
#     working. The shared `multi-domain` network only ever existed so the external
#     proxy could reach containers by name; Traefik routes by label now.
#   * No `container_name:`. Coolify overrides it with `<service>-<uuid>`, so leaving
#     it would only mislead.
#
#
# NOTE: runs a PRE-BUILT image rather than building from source. A fresh build fails
# today because a transitive package published a release requiring node >= 20 while
# the Dockerfile pins node 18 - dependency drift, not a change in this repo. This
# image is what production has been running; restoring a working source build is
# follow-up work.
# The image is served from a local registry on 127.0.0.1:5000 rather than referenced
# as a bare local tag, because the deployment platform runs `compose pull` before
# `up` and a tag that exists only in the local image store fails with
# `pull access denied`. The registry container is `migration-registry`
# (restart=always, data under /srv/appdata/registry).
services:
  bot:
    image: 127.0.0.1:5000/sab-delegate-bot:migrated-260921
    cpus: 2
    restart: always
    env_file:
      - .env
    volumes:
      - ./root/files:/usr/files:rw
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      - NOTE_DB_PATH=/usr/files/note.sqlite
      - WORD_DB_PATH=/usr/files/word.sqlite
      - DICT_DB_PATH=/usr/files/dict.sqlite
      - CONFIG_DB_PATH=/usr/files/config.sqlite
      - BIRTHDAY_DB_PATH=/usr/files/birthday.sqlite
      - TOKENS=${TOKENS}
