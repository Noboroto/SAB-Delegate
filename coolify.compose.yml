# Coolify-native variant of prod.compose.yml.
#
# prod.compose.yml is kept unchanged as the rollback artefact.
#
# What differs and why:
#   * No `networks:` block. Coolify gives each resource its own network and registers
#     every compose SERVICE name as an alias there, so intra-stack lookups keep
#     working. The shared `multi-domain` network only ever existed so the external
#     proxy could reach containers by name; Traefik routes by label now.
#   * No `container_name:`. Coolify overrides it with `<service>-<uuid>`, so leaving
#     it would only mislead.
#
#   * Builds from source. root/yarn.lock is committed and installed with
#     --frozen-lockfile, so a fresh clone reproduces the dependency versions
#     production was already running instead of resolving newer releases.
services:
  bot:
    build:
      context: .
      dockerfile: dockerfile
    cpus: 2
    restart: always
    env_file:
      - .env
    volumes:
      - ./root/files:/usr/files:rw
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      - NOTE_DB_PATH=/usr/files/note.sqlite
      - WORD_DB_PATH=/usr/files/word.sqlite
      - DICT_DB_PATH=/usr/files/dict.sqlite
      - CONFIG_DB_PATH=/usr/files/config.sqlite
      - BIRTHDAY_DB_PATH=/usr/files/birthday.sqlite
      - TOKENS=${TOKENS}
