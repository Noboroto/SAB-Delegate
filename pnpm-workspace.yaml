# The legacy bot in root/ keeps its own workspace file and lockfile; it must
# stay outside these globs so installing here never touches root/pnpm-lock.yaml.
packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 12 refuses to install while any dependency with an install script is
# undecided. @swc/core is the decorator-metadata transform behind the server's
# Vitest setup; its script only fetches the platform binary.
allowBuilds:
  '@swc/core': true
  # Prisma downloads its engines; the Zod generator only prints a notice in
  # postinstall, but pnpm 12 refuses the install while any build is undecided.
  prisma: true
  '@prisma/engines': true
  prisma-zod-generator: true
  # Its postinstall only prints a banner, but pnpm 12 refuses the install while
  # any build is undecided.
  necord: false

# necord 7 declares discord-api-types ^0.37.99 but only imports its types, and
# discord.js 14.27 needs 0.38. One copy of 0.38 serves both.
peerDependencyRules:
  allowedVersions:
    necord>discord-api-types: '0.38'

# One copy of the Better Auth core at the exact version the app pins. A caret
# range inside better-auth would let a later install pull a core whose account
# schema differs from the one the session code was measured against.
overrides:
  '@better-auth/core': 1.7.7
