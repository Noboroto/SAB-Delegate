# LOCAL ONLY: rehearses the production chain on a developer machine, with the
# production images built for the host's real architecture (linux/amd64) and a
# SAB Dev Discord application. Never referenced by coolify.compose.yml and never
# deployed.
#
#   docker compose -f deploy/local-smoke.compose.yml --env-file <env file> up --build
#
# It mirrors coolify.compose.yml service for service (same targets, same
# `environment:` allowlists, same entrypoint), so `docker exec <c> env` and
# `docker history` checks here prove what production will do. The differences are
# deliberate: the sab-db network is created and removed with the stack instead of
# being external, Postgres runs beside the app, data lives in throwaway volumes,
# and APP_ENV is development with a dev guild.
name: sab-local-smoke

networks:
  sab-db:
    name: sab-db

services:
  sab-postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    platform: linux/amd64
    command: ['postgres', '-c', 'timezone=UTC', '-c', 'log_timezone=UTC']
    networks:
      default: {}
      sab-db:
        aliases:
          - sab-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by deploy/initdb/01-roles.sh on the first start.
      POSTGRES_MIGRATE_USER: ${POSTGRES_MIGRATE_USER}
      POSTGRES_MIGRATE_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD}
      POSTGRES_RUNTIME_USER: ${POSTGRES_USER}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD}
    volumes:
      - smoke-postgres:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    shm_size: 256m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  sab-release:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: release
      platforms:
        - linux/amd64
    platform: linux/amd64
    restart: 'no'
    depends_on:
      sab-postgres:
        condition: service_healthy
    networks:
      - default
      - sab-db
    environment:
      POSTGRES_HOST: sab-postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_MIGRATE_USER: ${POSTGRES_MIGRATE_USER}
      POSTGRES_MIGRATE_PASSWORD: ${POSTGRES_MIGRATE_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_KEEP_PRE_MIGRATE: ${BACKUP_KEEP_PRE_MIGRATE:-5}
    volumes:
      - smoke-backups:/backups

  sab-server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: runner
      platforms:
        - linux/amd64
    platform: linux/amd64
    depends_on:
      sab-release:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - default
      - sab-db
    stop_signal: SIGTERM
    stop_grace_period: 45s
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3100/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 3s
    environment:
      APP_ENV: development
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_ALLOWED_APP_IDS: ${DISCORD_ALLOWED_APP_IDS}
      DISCORD_DEV_GUILD_ID: ${DISCORD_DEV_GUILD_ID}
      ADMIN_GUILD_ID: ${ADMIN_GUILD_ID}
      MIGRATION_PENDING: ${MIGRATION_PENDING:-false}
      COMMANDS_FORCE_RESET: ${COMMANDS_FORCE_RESET:-false}
      POSTGRES_HOST: sab-postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      PGBOSS_POOL_MAX: ${PGBOSS_POOL_MAX:-4}
      PGBOSS_WORKERS_ENABLED: ${PGBOSS_WORKERS_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-debug}

  sab-backup:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: release
      platforms:
        - linux/amd64
    platform: linux/amd64
    depends_on:
      sab-release:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - sab-db
    entrypoint:
      - /bin/sh
      - -c
      - |
        while :; do
          h=$$(date +%H); m=$$(date +%M); s=$$(date +%S)
          elapsed=$$(( $${h#0} * 3600 + $${m#0} * 60 + $${s#0} ))
          wait=$$(( (10800 - elapsed + 86400) % 86400 ))
          echo "backup: next daily dump in $${wait}s"
          sleep "$$wait"
          /bin/sh /app/apps/server/scripts/backup.sh daily || echo "backup: daily dump failed" >&2
          sleep 60
        done
    healthcheck:
      test: ['CMD-SHELL', 'pidof sh >/dev/null']
      interval: 60s
      timeout: 5s
      retries: 3
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_HOST: sab-postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_BACKUP_USER: ${POSTGRES_BACKUP_USER}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
    volumes:
      - smoke-backups:/backups

volumes:
  smoke-postgres:
  smoke-backups:
